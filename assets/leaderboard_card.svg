<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="860" height="210" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Header Title -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.2">MOTSOENENG BILL TECH · ENGINEERING TELEMETRY</text>
  <text x="32" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Engineering Contribution Leaderboard</text>

  <!-- Key Metrics Left -->
  <g transform="translate(32, 92)">
    <rect width="110" height="54" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">TOTAL COMMITS</text>
    <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#38bdf8">1,521</text>
  </g>

  <g transform="translate(152, 92)">
    <rect width="110" height="54" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">REPOSITORIES</text>
    <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#818cf8">7</text>
  </g>

  <g transform="translate(272, 92)">
    <rect width="110" height="54" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">TEAM MEMBERS</text>
    <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#34d399">7</text>
  </g>

  <!-- Top 3 Podium Cards Right -->

  <g transform="translate(410, 32)">
    <rect width="136" height="114" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Medal tag -->
    <rect x="8" y="8" width="40" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">1st</text>
    
    <!-- Member name -->
    <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">konethegre..</text>
    <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Principal Arch</text>
    
    <!-- Commits -->
    <text x="12" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#f59e0b">774 <tspan font-size="10" font-weight="500" fill="#64748b">commits</tspan></text>
  </g>

  <g transform="translate(558, 32)">
    <rect width="136" height="114" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Medal tag -->
    <rect x="8" y="8" width="40" height="18" rx="4" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1" />
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">2nd</text>
    
    <!-- Member name -->
    <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Akonisaho-MB</text>
    <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Senior Lead En</text>
    
    <!-- Commits -->
    <text x="12" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#94a3b8">345 <tspan font-size="10" font-weight="500" fill="#64748b">commits</tspan></text>
  </g>

  <g transform="translate(706, 32)">
    <rect width="136" height="114" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
    <!-- Medal tag -->
    <rect x="8" y="8" width="40" height="18" rx="4" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1" />
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">3rd</text>
    
    <!-- Member name -->
    <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Amukelani-MB</text>
    <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Senior Lead En</text>
    
    <!-- Commits -->
    <text x="12" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#d97706">249 <tspan font-size="10" font-weight="500" fill="#64748b">commits</tspan></text>
  </g>

  <!-- Contribution Distribution Bar -->
  <text x="32" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">TEAM COMMIT DISTRIBUTION</text>
  <clipPath id="barClip">
    <rect x="32" y="166" width="796" height="10" rx="5" />
  </clipPath>
  <g clip-path="url(#barClip)">
    <rect x="32.0" y="166" width="405.1" height="10" fill="#38bdf8" />
    <rect x="437.1" y="166" width="180.6" height="10" fill="#818cf8" />
    <rect x="617.6" y="166" width="130.3" height="10" fill="#34d399" />
    <rect x="747.9" y="166" width="47.6" height="10" fill="#f59e0b" />
    <rect x="795.6" y="166" width="29.3" height="10" fill="#ec4899" />
    <rect x="824.9" y="166" width="3.1" height="10" fill="#334155" />
