name: Update Dynamic Profile README & Leaderboard

on:
  schedule:
    # Run every 6 hours at 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - '.github/workflows/update-readme.yml'

concurrency:
  group: update-profile-readme
  cancel-in-progress: true

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Leaderboard & Telemetry Updater
        env:
          ORG_LEADERBOARD_TOKEN: ${{ secrets.ORG_LEADERBOARD_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_leaderboard.py

      - name: Commit & Push Dynamic Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/ profile/README.md
          if git diff --staged --quiet; then
            echo "No telemetry or leaderboard changes detected."
          else
            git commit -m "chore(telemetry): update engineering leaderboard & profile metrics [skip ci]"
            git push
          fi
